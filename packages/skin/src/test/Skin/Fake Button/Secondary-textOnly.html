<body style="
  background-color: var(--color-background-primary);
  color: var(--color-foreground-primary);
  font-family: "Market Sans", Arial, sans-serif;
  font-size: var(--font-size-body);
  line-height: var(--font-line-height-default);
  margin-bottom: 0px;
  margin-left: 0px;
  margin-right: 0px;
  margin-top: 0px;
  min-height: 100vh;
  text-size-adjust: 100%
">
  <div>
    <a style="
      align-content: center;
      align-items: center;
      background-color: var(--btn-secondary-background-color, transparent);
      border-bottom-style: solid;
      border-bottom-width: 1px;
      border-bottom: 1px solid;
      border-left-style: solid;
      border-left-width: 1px;
      border-right-style: solid;
      border-right-width: 1px;
      border-top-style: solid;
      border-top-width: 1px;
      border-top: 1px solid;
      box-sizing: border-box;
      color: var(--color-foreground-accent);
      display: inline-block;
      font-family: inherit;
      font-size: var(--font-size-body);
      min-height: 40px;
      min-width: 88px;
      overflow-x: hidden;
      overflow-y: hidden;
      padding-left: 20px;
      padding-right: 20px;
      position: relative;
      text-align: center;
      text-decoration-line: none;
      transition: all var(--motion-duration-short-3) var(--motion-easing-quick-enter);
      vertical-align: bottom
    ">
      <style>@scope{:scope{
        &::after {
          background-color: var(--color-state-layer-neutral);
          bottom: 0px;
          content: "";
          left: 0px;
          pointer-events: none;
          position: absolute;
          right: 0px;
          top: 0px
        }
      }}</style>
      Fake Button
    </a>
  </div>
</body>
