<body style="
  background-color: var(--color-background-primary);
  color: var(--color-foreground-primary);
  font-family: "Market Sans", Arial, sans-serif;
  font-size: var(--font-size-body);
  line-height: var(--font-line-height-default);
  margin-bottom: 0px;
  margin-left: 0px;
  margin-right: 0px;
  margin-top: 0px;
  min-height: 100vh;
  text-size-adjust: 100%
">
  <div>
    <span style="
      display: inline-block;
      vertical-align: bottom
    ">
      <div style="
        background-color: var(--menu-background-color, var(--color-background-primary));
        cursor: default
      ">
        <div style="
          border-bottom-style: solid;
          border-bottom-width: 1px;
          border-left-style: solid;
          border-left-width: 1px;
          border-right-style: solid;
          border-right-width: 1px;
          border-top-style: solid;
          border-top-width: 1px;
          box-sizing: border-box;
          color: var(--menu-menuitem-foreground-color, var(--color-foreground-primary));
          display: inline-grid;
          font-family: inherit;
          grid-template-columns: auto auto;
          justify-content: space-between;
          margin-bottom: 1px;
          overflow-x: hidden;
          overflow-y: hidden;
          padding-bottom: 8px;
          padding-left: 15px;
          padding-right: 15px;
          padding-top: 8px;
          position: relative;
          width: 100%
        ">
          <style>@scope{:scope{
            &::after {
              background-color: var(--color-state-layer-neutral);
              bottom: 0px;
              content: "";
              left: 0px;
              pointer-events: none;
              position: absolute;
              right: 0px;
              top: 0px
            }
          }}</style>
          <span style="
            flex-shrink: 0;
            text-align: left;
            text-wrap-mode: nowrap
          ">
            Item 1
          </span>
          <svg
            height="8"
            style="
              align-self: center;
              display: inline-block;
              fill: currentcolor;
              height: 16px;
              margin-left: var(--spacing-100);
              margin-right: var(--spacing-100);
              pointer-events: none;
              stroke-width: 0;
              stroke: currentcolor;
              vertical-align: middle;
              width: 16px
            "
            width="8"
          >
            <use href="#icon-tick-16"/>
          </svg>
        </div>
