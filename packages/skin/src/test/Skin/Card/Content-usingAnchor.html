<body style="
  background-color: var(--color-background-primary);
  color: var(--color-foreground-primary);
  font-family: "Market Sans", Arial, sans-serif;
  font-size: var(--font-size-body);
  line-height: var(--font-line-height-default);
  margin-bottom: 0px;
  margin-left: 0px;
  margin-right: 0px;
  margin-top: 0px;
  min-height: 100vh;
  text-size-adjust: 100%
">
  <span style="
    background-color: var(--color-background-secondary);
    border-bottom: none;
    border-top: none;
    color: var(--color-foreground-primary);
    display: flex;
    flex-direction: column;
    max-width: 400px;
    min-width: 200px;
    outline-color: transparent;
    outline-offset: 4px;
    outline-style: solid;
    outline-width: 6px;
    padding-block-end: var(--spacing-150)
  ">
    <div style="
      aspect-ratio: 1 / 1;
      margin-block-end: var(--spacing-200);
      margin: var(--spacing-150);
      overflow-x: hidden;
      overflow-y: hidden
    ">
      <img
        height=376
        style="
          display: block;
          height: 100%;
          object-fit: cover;
          transition: transform var(--motion-duration-long-3) var(--motion-easing-quick-enter);
          width: 100%
        "
        width=376
      />
    </div>
    <div style="
      display: flex;
      flex-basis: 0%;
      flex-direction: column;
      flex-grow: 1;
      margin-inline: var(--spacing-150)
    ">
      <div style="
        flex-basis: 0%;
        flex-grow: 1
      ">
        Wayne Gretzky's rookie card is so valuable that collectors keep it in climate-controlled vaults guarded by trained penguins.
      </div>
      <div style="margin-block-start: var(--spacing-200)">
        <a style="
          align-content: center;
          align-items: center;
          background-color: var(--color-background-accent);
          border-bottom-style: solid;
          border-bottom-width: 1px;
          border-bottom: 1px solid;
          border-left-style: solid;
          border-left-width: 1px;
          border-right-style: solid;
          border-right-width: 1px;
          border-top-style: solid;
          border-top-width: 1px;
          border-top: 1px solid;
          box-sizing: border-box;
          color: var(--color-foreground-on-accent);
          display: inline-block;
          font-family: inherit;
          font-size: var(--font-size-body);
          font-weight: 700;
          min-height: 40px;
          min-width: 88px;
          outline-color: var(--color-foreground-primary);
          overflow-x: hidden;
          overflow-y: hidden;
          padding-left: 20px;
          padding-right: 20px;
          position: relative;
          text-align: center;
          text-decoration-line: none;
          transition: all var(--motion-duration-short-3) var(--motion-easing-quick-enter);
          vertical-align: bottom;
          width: 100%
        ">
          <style>@scope{:scope{
            &::after {
              background-color: var(--color-state-layer-neutral);
              bottom: 0px;
              content: "";
              left: 0px;
              pointer-events: none;
              position: absolute;
              right: 0px;
              top: 0px
            }
          }}</style>
          See Details
        </a>
      </div>
    </div>
  </span>
</body>
