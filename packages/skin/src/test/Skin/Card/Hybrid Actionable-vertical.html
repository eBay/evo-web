<body style="
  background-color: var(--color-background-primary);
  color: var(--color-foreground-primary);
  font-family: "Market Sans", Arial, sans-serif;
  font-size: var(--font-size-body);
  line-height: var(--font-line-height-default);
  margin-bottom: 0px;
  margin-left: 0px;
  margin-right: 0px;
  margin-top: 0px;
  min-height: 100vh;
  text-size-adjust: 100%
">
  <div style="
    background-color: inherit;
    border-bottom: none;
    border-top: none;
    border: 1px solid var(--color-border-subtle);
    color: var(--color-foreground-primary);
    display: flex;
    flex-direction: column;
    max-width: 400px;
    min-width: 200px;
    outline-color: transparent;
    outline-offset: 4px;
    outline-style: solid;
    outline-width: 6px;
    padding-block-end: var(--spacing-150)
  ">
    <div style="
      aspect-ratio: 1 / 1;
      margin-block-end: var(--spacing-200);
      margin: var(--spacing-150);
      overflow-x: hidden;
      overflow-y: hidden
    ">
      <img
        height=376
        src="https://ir.ebaystatic.com/cr/v/c01/skin/docs/cards-card.jpeg"
        style="
          display: block;
          height: 100%;
          object-fit: cover;
          transition: transform var(--motion-duration-long-3) var(--motion-easing-quick-enter);
          width: 100%
        "
        width=376
      />
    </div>
    <div style="
      display: flex;
      flex-basis: 0%;
      flex-direction: column;
      flex-grow: 1;
      margin-inline: var(--spacing-150)
    ">
      <div style="
        align-items: center;
        display: flex;
        font-weight: 700;
        margin-block-end: var(--spacing-100)
      ">
        <svg
          height="16"
          style="
            display: inline-block;
            fill: currentcolor;
            height: 16px;
            pointer-events: none;
            stroke-width: 0;
            stroke: currentcolor;
            vertical-align: middle;
            width: 16px
          "
          width="16"
        >
          <use href="#icon-authenticity-guarantee-filled-16-colored"/>
        </svg>
        <span>
          Authenticity Guaranteed
        </span>
      </div>
      <div style="
        font-size: var(--font-size-large-1);
        font-weight: 700;
        margin-block-end: var(--spacing-50)
      ">
        Authentic Rookie Cards
      </div>
      <div style="
        flex-basis: 0%;
        flex-grow: 1
      ">
        Rookie cards that serve as a hedge against the apocalypse – when society collapses, surely someone will trade food for a mint Luka Dončić card.
      </div>
      <div style="margin-block-start: var(--spacing-200)">
        <button style="
          align-content: center;
          align-items: center;
          background-color: var(--color-background-accent);
          border-bottom-style: solid;
          border-bottom-width: 1px;
          border-bottom: 1px solid;
          border-left-style: solid;
          border-left-width: 1px;
          border-right-style: solid;
          border-right-width: 1px;
          border-top-style: solid;
          border-top-width: 1px;
          border-top: 1px solid;
          color: var(--color-foreground-on-accent);
          font-family: inherit;
          font-size: var(--font-size-body);
          font-weight: 700;
          min-height: 40px;
          min-width: 88px;
          overflow-x: hidden;
          overflow-y: hidden;
          padding-bottom: 0px;
          padding-left: 20px;
          padding-right: 20px;
          padding-top: 0px;
          position: relative;
          transition: all var(--motion-duration-short-3) var(--motion-easing-quick-enter);
          vertical-align: bottom;
          width: 100%
        ">
          <style>@scope{:scope{
            &::after {
              background-color: var(--color-state-layer-neutral);
              bottom: 0px;
              content: "";
              left: 0px;
              pointer-events: none;
              position: absolute;
              right: 0px;
              top: 0px
            }
          }}</style>
          See Details
        </button>
      </div>
    </div>
  </div>
</body>
