<body style="
  background-color: var(--color-background-primary);
  color: var(--color-foreground-primary);
  font-family: "Market Sans", Arial, sans-serif;
  font-size: var(--font-size-body);
  line-height: var(--font-line-height-default);
  margin-bottom: 0px;
  margin-left: 0px;
  margin-right: 0px;
  margin-top: 0px;
  min-height: 100vh;
  text-size-adjust: 100%
">
  <a style="
    background-color: var(--color-background-secondary);
    border-bottom: none;
    border-top: none;
    color: inherit;
    display: flex;
    max-width: 100%;
    min-width: 200px;
    outline-color: transparent;
    outline-offset: 4px;
    outline-style: solid;
    outline-width: 6px;
    padding-block-end: var(--spacing-150);
    text-decoration-line: none;
    width: 100%
  ">
    <div style="
      aspect-ratio: 1 / 1;
      margin: var(--spacing-150);
      max-width: 160px;
      min-width: 90px;
      overflow-x: hidden;
      overflow-y: hidden;
      width: 25%
    ">
      <img
        height=104
        src="https://ir.ebaystatic.com/cr/v/c01/skin/docs/cards-card.jpeg"
        style="
          aspect-ratio: 1 / 1;
          display: block;
          height: auto;
          object-fit: cover;
          transition: transform var(--motion-duration-long-3) var(--motion-easing-quick-enter);
          width: 100%
        "
        width=104
      />
    </div>
    <div style="
      display: flex;
      flex-basis: 0%;
      flex-direction: column;
      flex-grow: 1;
      margin-block-start: var(--spacing-150);
      margin-inline: var(--spacing-150)
    ">
      <h3 style="
        font-size: var(--font-size-large-1);
        margin-block-end: var(--spacing-50);
        margin-bottom: 0px;
        margin-top: 0px
      ">
        Authentic Rookie Cards
      </h3>
      <div style="
        flex-basis: 0%;
        flex-grow: 1
      ">
        A collection proving that somewhere between a curveball, a three-pointer, and a slap shot lies the secret to happiness.
      </div>
    </div>
  </a>
</body>
