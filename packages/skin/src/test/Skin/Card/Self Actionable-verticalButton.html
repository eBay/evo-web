<body style="
  background-color: var(--color-background-primary);
  color: var(--color-foreground-primary);
  font-family: "Market Sans", Arial, sans-serif;
  font-size: var(--font-size-body);
  line-height: var(--font-line-height-default);
  margin-bottom: 0px;
  margin-left: 0px;
  margin-right: 0px;
  margin-top: 0px;
  min-height: 100vh;
  text-size-adjust: 100%
">
  <button style="
    background-color: var(--color-background-secondary);
    border-bottom-style: none;
    border-bottom: none;
    border-left-style: none;
    border-right-style: none;
    border-top-style: none;
    border-top: none;
    color: var(--color-foreground-primary);
    display: flex;
    flex-direction: column;
    font-family: inherit;
    font-size: inherit;
    line-height: inherit;
    max-width: 400px;
    min-width: 200px;
    outline-color: transparent;
    outline-offset: 4px;
    outline-style: solid;
    outline-width: 6px;
    padding-block-end: var(--spacing-150);
    padding-bottom: 0px;
    padding-left: 0px;
    padding-right: 0px;
    padding-top: 0px;
    text-align: start;
    transition: transform var(--motion-duration-medium-3) var(--motion-easing-quick-enter), box-shadow var(--motion-duration-medium-3) var(--motion-easing-quick-enter)
  ">
    <div style="
      aspect-ratio: 1 / 1;
      margin-block-end: var(--spacing-200);
      margin: var(--spacing-150);
      overflow-x: hidden;
      overflow-y: hidden
    ">
      <img
        height=376
        src="https://ir.ebaystatic.com/cr/v/c01/skin/docs/cards-card.jpeg"
        style="
          display: block;
          height: 100%;
          object-fit: cover;
          transition: transform var(--motion-duration-long-3) var(--motion-easing-quick-enter);
          width: 100%
        "
        width=376
      />
    </div>
    <div style="
      display: flex;
      flex-basis: 0%;
      flex-direction: column;
      flex-grow: 1;
      margin-inline: var(--spacing-150)
    ">
      <h3 style="
        font-size: var(--font-size-large-1);
        margin-block-end: var(--spacing-50);
        margin-bottom: 0px;
        margin-top: 0px
      ">
        Authentic Rookie Cards
      </h3>
      <div style="
        flex-basis: 0%;
        flex-grow: 1
      ">
        Professional-grade rookie cards featuring future Hall of Famers in their awkward rookie photo phase.
      </div>
    </div>
  </button>
</body>
