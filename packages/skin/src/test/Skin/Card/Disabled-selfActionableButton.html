<body style="
  background-color: var(--color-background-primary);
  color: var(--color-foreground-primary);
  font-family: "Market Sans", Arial, sans-serif;
  font-size: var(--font-size-body);
  line-height: var(--font-line-height-default);
  margin-bottom: 0px;
  margin-left: 0px;
  margin-right: 0px;
  margin-top: 0px;
  min-height: 100vh;
  text-size-adjust: 100%
">
  <button
    disabled
    style="
      background-color: var(--color-background-secondary);
      border-bottom-style: none;
      border-bottom: none;
      border-left-style: none;
      border-right-style: none;
      border-top-style: none;
      border-top: none;
      color: var(--color-foreground-primary);
      display: flex;
      filter: grayscale(1);
      flex-direction: column;
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      max-width: 400px;
      min-width: 200px;
      opacity: 0.5;
      outline-color: transparent;
      outline-offset: 4px;
      outline-style: solid;
      outline-width: 6px;
      padding-block-end: var(--spacing-150);
      padding-bottom: 0px;
      padding-left: 0px;
      padding-right: 0px;
      padding-top: 0px;
      pointer-events: none;
      text-align: start;
      transition: transform var(--motion-duration-medium-3) var(--motion-easing-quick-enter), box-shadow var(--motion-duration-medium-3) var(--motion-easing-quick-enter)
    "
  >
    <div style="
      aspect-ratio: 16 / 9;
      margin-block-end: var(--spacing-200);
      margin: var(--spacing-150);
      overflow-x: hidden;
      overflow-y: hidden
    ">
      <img
        height=212
        style="
          display: block;
          height: 100%;
          object-fit: cover;
          transition: transform var(--motion-duration-long-3) var(--motion-easing-quick-enter);
          width: 100%
        "
        width=376
      />
    </div>
    <div style="
      display: flex;
      flex-basis: 0%;
      flex-direction: column;
      flex-grow: 1;
      margin-inline: var(--spacing-150)
    ">
      <div style="
        flex-basis: 0%;
        flex-grow: 1
      ">
        Hockey cards collected by enthusiasts who treat them like fine wine – stored in temperature-controlled cellars and discussed in hushed, reverent tones.
      </div>
    </div>
  </button>
</body>
