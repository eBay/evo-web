<body style="
  background-color: var(--color-background-primary);
  color: var(--color-foreground-primary);
  font-family: "Market Sans", Arial, sans-serif;
  font-size: var(--font-size-body);
  line-height: var(--font-line-height-default);
  margin-bottom: 0px;
  margin-left: 0px;
  margin-right: 0px;
  margin-top: 0px;
  min-height: 100vh;
  text-size-adjust: 100%
">
  <div>
    <div dir="rtl">
      <div style="
        align-items: baseline;
        display: flex;
        margin-bottom: 10px;
        margin-top: 30px
      ">
        <div style="max-width: 75%">
          <h2 style="
            font-size: var(--font-size-large-1);
            font-weight: var(--font-weight-600);
            line-height: 28px;
            margin-bottom: 0px;
            margin-top: 0px
          ">
            Marketing Type Content Title
          </h2>
          <span style="
            color: var(--section-title-subtitle-color, var(--color-foreground-secondary));
            font-size: var(--font-size-body);
            line-height: 20px
          ">
            Recommended for you
          </span>
        </div>
        <div style="
          bottom: -3px;
          margin: 0 var(--spacing-100) 0 var(--spacing-300);
          position: relative
        ">
          <button style="
            align-items: center;
            background-color: var(--color-background-secondary);
            border-bottom-color: transparent;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
            border-bottom-style: solid;
            border-left-color: transparent;
            border-left-style: solid;
            border-right-color: transparent;
            border-right-style: solid;
            border-top-color: transparent;
            border-top-left-radius: 50px;
            border-top-right-radius: 50px;
            border-top-style: solid;
            display: inline-flex;
            font-family: inherit;
            height: var(--spacing-400);
            justify-content: center;
            min-width: var(--spacing-400);
            overflow-x: hidden;
            overflow-y: hidden;
            padding-bottom: 0px;
            padding-left: 0px;
            padding-right: 0px;
            padding-top: 0px;
            position: relative;
            vertical-align: text-bottom;
            width: var(--spacing-400)
          ">
            <style>@scope{:scope{
              &::after {
                background-color: var(--color-state-layer-neutral);
                border-bottom-left-radius: 50px;
                border-bottom-right-radius: 50px;
                border-top-left-radius: 50px;
                border-top-right-radius: 50px;
                bottom: 0px;
                content: "";
                left: 0px;
                pointer-events: none;
                position: absolute;
                right: 0px;
                top: 0px
              }
            }}</style>
            <svg
              height="14"
              style="
                display: inline-block;
                fill: var(--color-foreground-primary);
                height: 16px;
                max-width: 75%;
                pointer-events: none;
                position: relative;
                stroke-width: 0;
                stroke: currentcolor;
                vertical-align: middle;
                width: 16px
              "
              width="16"
            >
              <use href="#icon-heart-16"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
