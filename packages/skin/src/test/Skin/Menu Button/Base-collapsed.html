<body style="
  background-color: var(--color-background-primary);
  color: var(--color-foreground-primary);
  font-family: "Market Sans", Arial, sans-serif;
  font-size: var(--font-size-body);
  line-height: var(--font-line-height-default);
  margin-bottom: 0px;
  margin-left: 0px;
  margin-right: 0px;
  margin-top: 0px;
  min-height: 100vh;
  text-size-adjust: 100%
">
  <span style="position: relative">
    <button style="
      align-content: center;
      align-items: center;
      background-color: var(--btn-secondary-background-color, transparent);
      border-bottom-style: solid;
      border-bottom-width: 1px;
      border-bottom: 1px solid;
      border-left-style: solid;
      border-left-width: 1px;
      border-right-style: solid;
      border-right-width: 1px;
      border-top-style: solid;
      border-top-width: 1px;
      border-top: 1px solid;
      color: var(--color-foreground-accent);
      font-family: inherit;
      font-size: var(--font-size-body);
      min-height: 40px;
      min-width: 88px;
      overflow-x: hidden;
      overflow-y: hidden;
      padding-bottom: 0px;
      padding-left: 20px;
      padding-right: 20px;
      padding-top: 0px;
      position: relative;
      transition: all var(--motion-duration-short-3) var(--motion-easing-quick-enter);
      vertical-align: bottom
    ">
      <style>@scope{:scope{
        &::after {
          background-color: var(--color-state-layer-neutral);
          bottom: 0px;
          content: "";
          left: 0px;
          pointer-events: none;
          position: absolute;
          right: 0px;
          top: 0px
        }
      }}</style>
      <span style="
        align-items: center;
        display: flex;
        justify-content: center;
        width: 100%
      ">
        <span>
          Button
        </span>
        <svg
          height="8"
          style="
            align-self: center;
            display: inline-block;
            fill: currentcolor;
            height: 12px;
            margin-inline-start: 8px;
            pointer-events: none;
            stroke-width: 0;
            stroke: currentcolor;
            vertical-align: middle;
            width: 12px
          "
          width="8"
        >
          <use href="#icon-chevron-down-12"/>
        </svg>
      </span>
    </button>
  </span>
</body>
