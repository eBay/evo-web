<body style="
  background-color: var(--color-background-primary);
  color: var(--color-foreground-primary);
  font-family: "Market Sans", Arial, sans-serif;
  font-size: var(--font-size-body);
  line-height: var(--font-line-height-default);
  margin-bottom: 0px;
  margin-left: 0px;
  margin-right: 0px;
  margin-top: 0px;
  min-height: 100vh;
  text-size-adjust: 100%
">
  <div>
    <span style="position: relative">
      <button style="
        align-items: center;
        animation: fill-horizontal-background 0s var(--motion-easing-quick-enter) forwards;
        background-color: var(--color-background-primary);
        background-image: linear-gradient(to right, var(--color-background-strong) 0, var(--color-background-strong) 100%);
        background-position-x: 50%;
        background-position-y: center;
        background-repeat: no-repeat;
        background-size: 0px 100%;
        border: 1px solid var(--color-border-medium);
        color: var(--color-foreground-on-strong);
        display: inline-flex;
        font-family: inherit;
        font-size: var(--font-size-body);
        height: var(--spacing-400);
        justify-content: space-between;
        max-width: 296px;
        min-width: 32px;
        overflow-x: hidden;
        overflow-y: hidden;
        padding: 0 var(--spacing-150);
        position: relative;
        transition: all var(--motion-duration-short-3) var(--motion-easing-quick-enter);
        vertical-align: bottom
      ">
        <style>@scope{:scope{
          &::after {
            background-color: var(--color-state-layer-neutral-on-strong);
            bottom: 0px;
            content: "";
            left: 0px;
            pointer-events: none;
            position: absolute;
            right: 0px;
            top: 0px
          }
        }}</style>
        <span style="
          overflow-x: hidden;
          overflow-y: hidden;
          padding: var(--spacing-75) 0;
          text-overflow: ellipsis;
          text-wrap-mode: nowrap
        ">
          Sport: (+2)
        </span>
        <svg
          height="8"
          style="
            display: inline-block;
            fill: currentcolor;
            height: 12px;
            pointer-events: none;
            stroke-width: 0;
            stroke: currentcolor;
            vertical-align: middle;
            width: 12px
          "
          width="8"
        >
          <use href="#icon-chevron-down-12"/>
        </svg>
      </button>
      <div style="
        background-color: var(--color-background-elevated);
        box-shadow: var(--bubble-shadow);
        box-sizing: border-box;
        left: 0px;
        max-height: 400px;
        min-width: 100%;
        overflow-y: auto;
        position: absolute;
        top: calc(100% + 4px);
        width: auto;
        z-index: 2
      ">
        <div>
          <div style="
            border-bottom-style: solid;
            border-bottom-width: 1px;
            border-left-style: solid;
            border-left-width: 1px;
            border-right-style: solid;
            border-right-width: 1px;
            border-top-left-radius: var(--menu-button-menu-border-radius, var(--border-radius-50));
            border-top-right-radius: var(--menu-button-menu-border-radius, var(--border-radius-50));
            border-top-style: solid;
            border-top-width: 1px;
            box-sizing: border-box;
            color: var(--menu-button-menuitem-foreground-color, var(--color-foreground-primary));
            cursor: default;
            display: inline-grid;
            font-family: inherit;
            grid-template-columns: auto auto;
            justify-content: flex-start;
            margin-bottom: 1px;
            overflow-x: hidden;
            overflow-y: hidden;
            padding-bottom: 8px;
            padding-left: 15px;
            padding-right: 15px;
            padding-top: 8px;
            position: relative;
            width: 100%
          ">
            <style>@scope{:scope{
              &::after {
                background-color: var(--color-state-layer-neutral);
                bottom: 0px;
                content: "";
                left: 0px;
                pointer-events: none;
                position: absolute;
                right: 0px;
                top: 0px
              }
            }}</style>
            <svg
              height="18"
              style="
                color: var(--color-foreground-primary);
                display: block;
                fill: currentcolor;
                height: 18px;
                margin-right: var(--spacing-100);
                pointer-events: none;
                stroke-width: 0;
                stroke: currentcolor;
                vertical-align: middle;
                width: 18px
              "
              width="18"
            >
              <use href="#icon-checkbox-checked-18"/>
            </svg>
            <span style="
              flex-grow: 1;
              flex-shrink: 0;
              text-wrap-mode: nowrap
            ">
              Menu Item 1
            </span>
          </div>
          <div style="
            border-bottom-style: solid;
            border-bottom-width: 1px;
            border-left-style: solid;
            border-left-width: 1px;
            border-right-style: solid;
            border-right-width: 1px;
            border-top-style: solid;
            border-top-width: 1px;
            box-sizing: border-box;
            color: var(--menu-button-menuitem-foreground-color, var(--color-foreground-primary));
            cursor: default;
            display: inline-grid;
            font-family: inherit;
            grid-template-columns: auto auto;
            justify-content: flex-start;
            margin-bottom: 1px;
            overflow-x: hidden;
            overflow-y: hidden;
            padding-bottom: 8px;
            padding-left: 15px;
            padding-right: 15px;
            padding-top: 8px;
            position: relative;
            width: 100%
          ">
            <style>@scope{:scope{
              &::after {
                background-color: var(--color-state-layer-neutral);
                bottom: 0px;
                content: "";
                left: 0px;
                pointer-events: none;
                position: absolute;
                right: 0px;
                top: 0px
              }
            }}</style>
            <svg
              height="18"
              style="
                color: var(--color-foreground-primary);
                display: block;
                fill: currentcolor;
                height: 18px;
                margin-right: var(--spacing-100);
                pointer-events: none;
                stroke-width: 0;
                stroke: currentcolor;
                vertical-align: middle;
                width: 18px
              "
              width="18"
            >
              <use href="#icon-checkbox-checked-18"/>
            </svg>
            <span style="
              flex-grow: 1;
              flex-shrink: 0;
              text-wrap-mode: nowrap
            ">
              Menu Item 2
            </span>
          </div>
          <div style="
            border-bottom-left-radius: var(--menu-button-menu-border-radius, var(--border-radius-50));
            border-bottom-right-radius: var(--menu-button-menu-border-radius, var(--border-radius-50));
            border-bottom-style: solid;
            border-bottom-width: 1px;
            border-left-style: solid;
            border-left-width: 1px;
            border-right-style: solid;
            border-right-width: 1px;
            border-top-style: solid;
            border-top-width: 1px;
            box-sizing: border-box;
            color: var(--menu-button-menuitem-foreground-color, var(--color-foreground-primary));
            cursor: default;
            display: inline-grid;
            font-family: inherit;
            grid-template-columns: auto auto;
            justify-content: flex-start;
            overflow-x: hidden;
            overflow-y: hidden;
            padding-bottom: 8px;
            padding-left: 15px;
            padding-right: 15px;
            padding-top: 8px;
            position: relative;
            width: 100%
          ">
            <style>@scope{:scope{
              &::after {
                background-color: var(--color-state-layer-neutral);
                bottom: 0px;
                content: "";
                left: 0px;
                pointer-events: none;
                position: absolute;
                right: 0px;
                top: 0px
              }
            }}</style>
            <svg
              height="18"
              style="
                color: var(--color-foreground-secondary);
                display: block;
                fill: currentcolor;
                height: 18px;
                margin-right: var(--spacing-100);
                pointer-events: none;
                stroke-width: 0;
                stroke: currentcolor;
                vertical-align: middle;
                width: 18px
              "
              width="18"
            >
              <use href="#icon-checkbox-unchecked-18"/>
            </svg>
            <span style="
              flex-grow: 1;
              flex-shrink: 0;
              text-wrap-mode: nowrap
            ">
              Menu Item 3
            </span>
          </div>
        </div>
      </div>
    </span>
  </div>
</body>
