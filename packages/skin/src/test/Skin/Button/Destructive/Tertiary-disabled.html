<body style="
  background-color: var(--color-background-primary);
  color: var(--color-foreground-primary);
  font-family: "Market Sans", Arial, sans-serif;
  font-size: var(--font-size-body);
  line-height: var(--font-line-height-default);
  margin-bottom: 0px;
  margin-left: 0px;
  margin-right: 0px;
  margin-top: 0px;
  min-height: 100vh;
  text-size-adjust: 100%
">
  <div>
    <button
      disabled
      style="
        align-content: center;
        align-items: center;
        border-bottom-style: solid;
        border-bottom-width: 1px;
        border-bottom: 1px solid;
        border-left-style: solid;
        border-left-width: 1px;
        border-right-style: solid;
        border-right-width: 1px;
        border-top-style: solid;
        border-top-width: 1px;
        border-top: 1px solid;
        color: var(--btn-tertiary-destructive-disabled-foreground-color, var(--color-foreground-disabled));
        font-family: inherit;
        font-size: var(--font-size-body);
        min-height: 40px;
        min-width: 88px;
        overflow-x: hidden;
        overflow-y: hidden;
        padding-bottom: 0px;
        padding-left: 20px;
        padding-right: 20px;
        padding-top: 0px;
        position: relative;
        transition: all var(--motion-duration-short-3) var(--motion-easing-quick-enter);
        vertical-align: bottom
      "
    >
      <style>@scope{:scope{
        &::after {
          background-color: var(--color-state-layer-neutral);
          bottom: 0px;
          content: "";
          left: 0px;
          pointer-events: none;
          position: absolute;
          right: 0px;
          top: 0px
        }
      }}</style>
      Tertiary
    </button>
  </div>
</body>
