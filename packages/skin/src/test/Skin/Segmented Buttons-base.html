<body style="
  background-color: var(--color-background-primary);
  color: var(--color-foreground-primary);
  font-family: "Market Sans", Arial, sans-serif;
  font-size: var(--font-size-body);
  line-height: var(--font-line-height-default);
  margin-bottom: 0px;
  margin-left: 0px;
  margin-right: 0px;
  margin-top: 0px;
  min-height: 100vh;
  text-size-adjust: 100%
">
  <div>
    <div style="
      border: 1px solid var(--color-border-medium);
      max-width: 720px;
      min-width: 215px;
      padding: var(--spacing-50)
    ">
      <ul style="
        display: flex;
        list-style-type: none;
        margin-bottom: 0px;
        margin-top: 0px;
        padding-left: 0px
      ">
        <li style="
          display: flex;
          flex-basis: 0%;
          flex-grow: 1
        ">
          <button style="
            background-color: var(--color-foreground-primary);
            border-bottom-style: none;
            border-bottom: none;
            border-left-style: none;
            border-right-style: none;
            border-top-style: none;
            border-top: none;
            color: var(--color-foreground-on-inverse);
            font-family: inherit;
            font-size: var(--font-size-body);
            min-height: calc(40px - var(--spacing-50)*2);
            padding: var(--spacing-100) var(--spacing-200);
            width: 100%
          ">
            Day
          </button>
        </li>
        <li style="
          display: flex;
          flex-basis: 0%;
          flex-grow: 1;
          margin-inline-start: var(--spacing-100)
        ">
          <button style="
            border-bottom-style: none;
            border-bottom: none;
            border-left-style: none;
            border-right-style: none;
            border-top-style: none;
            border-top: none;
            color: var(--color-foreground-primary);
            font-family: inherit;
            font-size: var(--font-size-body);
            min-height: calc(40px - var(--spacing-50)*2);
            overflow-x: hidden;
            overflow-y: hidden;
            padding: var(--spacing-100) var(--spacing-200);
            position: relative;
            width: 100%
          ">
            <style>@scope{:scope{
              &::after {
                background-color: var(--color-state-layer-neutral);
                bottom: 0px;
                content: "";
                left: 0px;
                pointer-events: none;
                position: absolute;
                right: 0px;
                top: 0px
              }
            }}</style>
            Month
          </button>
        </li>
        <li style="
          display: flex;
          flex-basis: 0%;
          flex-grow: 1;
          margin-inline-start: var(--spacing-100)
        ">
          <button style="
            border-bottom-style: none;
            border-bottom: none;
            border-left-style: none;
            border-right-style: none;
            border-top-style: none;
            border-top: none;
            color: var(--color-foreground-primary);
            font-family: inherit;
            font-size: var(--font-size-body);
            min-height: calc(40px - var(--spacing-50)*2);
            overflow-x: hidden;
            overflow-y: hidden;
            padding: var(--spacing-100) var(--spacing-200);
            position: relative;
            width: 100%
          ">
            <style>@scope{:scope{
              &::after {
                background-color: var(--color-state-layer-neutral);
                bottom: 0px;
                content: "";
                left: 0px;
                pointer-events: none;
                position: absolute;
                right: 0px;
                top: 0px
              }
            }}</style>
            Year
          </button>
        </li>
      </ul>
    </div>
  </div>
</body>
