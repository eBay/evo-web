<body style="
  background-color: var(--color-background-primary);
  color: var(--color-foreground-primary);
  font-family: "Market Sans", Arial, sans-serif;
  font-size: var(--font-size-body);
  line-height: var(--font-line-height-default);
  margin-bottom: 0px;
  margin-left: 0px;
  margin-right: 0px;
  margin-top: 0px;
  min-height: 100vh;
  text-size-adjust: 100%
">
  <div>
    <button style="
      align-items: center;
      animation: fill-horizontal-background 0s var(--motion-easing-quick-enter) forwards;
      background-color: var(--color-background-primary);
      background-image: linear-gradient(to right, var(--color-background-strong) 0, var(--color-background-strong) 100%);
      background-position-x: 50%;
      background-position-y: center;
      background-repeat: no-repeat;
      background-size: 0px 100%;
      color: var(--color-foreground-on-strong);
      display: inline-flex;
      font-family: inherit;
      font-size: var(--font-size-body);
      height: 40px;
      justify-content: space-between;
      max-width: 296px;
      min-width: 32px;
      overflow-x: hidden;
      overflow-y: hidden;
      padding: 0 var(--spacing-150);
      position: relative;
      transition: all var(--motion-duration-short-3) var(--motion-easing-quick-enter);
      vertical-align: bottom
    ">
      <style>@scope{:scope{
        &::after {
          background-color: var(--color-state-layer-neutral-on-strong);
          bottom: 0px;
          content: "";
          left: 0px;
          pointer-events: none;
          position: absolute;
          right: 0px;
          top: 0px
        }
      }}</style>
      <span style="
        align-items: center;
        border-bottom-left-radius: 8px;
        border-bottom-right-radius: 8px;
        border-top-left-radius: 8px;
        border-top-right-radius: 8px;
        display: flex;
        justify-content: center;
        margin-inline-start: -8px;
        overflow-x: hidden;
        overflow-y: hidden;
        position: relative
      ">
        <style>@scope{:scope{
          &::after {
            background-color: rgba(0, 0, 0, 0.05);
            bottom: 0px;
            content: "";
            display: block;
            left: 0px;
            pointer-events: none;
            position: absolute;
            right: 0px;
            top: 0px
          }
        }}</style>
        <img
          height=32
          src="https://ir.ebaystatic.com/cr/v/c01/skin/docs/dog_profile_optimized.jpg"
          style="
            display: inline-block;
            height: var(--spacing-400);
            max-height: 100%;
            max-width: 100%;
            object-fit: cover;
            width: var(--spacing-400)
          "
          width=32
        />
      </span>
      <span style="
        overflow-x: hidden;
        overflow-y: hidden;
        padding: var(--spacing-75) 0;
        text-overflow: ellipsis;
        text-wrap-mode: nowrap
      ">
        Football
      </span>
    </button>
  </div>
</body>
