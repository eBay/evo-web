<body style="
  background-color: var(--color-background-primary);
  color: var(--color-foreground-primary);
  font-family: "Market Sans", Arial, sans-serif;
  font-size: var(--font-size-body);
  line-height: var(--font-line-height-default);
  margin-bottom: 0px;
  margin-left: 0px;
  margin-right: 0px;
  margin-top: 0px;
  min-height: 100vh;
  text-size-adjust: 100%
">
  <a style="
    align-items: center;
    animation: fill-horizontal-background 0s var(--motion-easing-quick-enter) forwards;
    background-color: var(--color-background-primary);
    background-image: linear-gradient(to right, var(--color-background-strong) 0, var(--color-background-strong) 100%);
    background-position-x: 50%;
    background-position-y: center;
    background-repeat: no-repeat;
    background-size: 0px 100%;
    border: 1px solid var(--color-border-medium);
    box-sizing: border-box;
    color: var(--color-foreground-on-strong);
    display: inline-flex;
    font-size: var(--font-size-body);
    height: var(--spacing-400);
    justify-content: space-between;
    max-width: 296px;
    min-width: 32px;
    overflow-x: hidden;
    overflow-y: hidden;
    padding: 0 var(--spacing-150);
    position: relative;
    text-decoration-line: none;
    transition: all var(--motion-duration-short-3) var(--motion-easing-quick-enter);
    vertical-align: bottom
  ">
    <style>@scope{:scope{
      &::after {
        background-color: var(--color-state-layer-neutral-on-strong);
        bottom: 0px;
        content: "";
        left: 0px;
        pointer-events: none;
        position: absolute;
        right: 0px;
        top: 0px
      }
    }}</style>
    <svg
      height="16"
      style="
        display: inline-block;
        fill: currentcolor;
        height: 16px;
        pointer-events: none;
        stroke-width: 0;
        stroke: currentcolor;
        vertical-align: middle;
        width: 16px
      "
      width="16"
    >
      <use href="#icon-sneaker-16"/>
    </svg>
    <span style="
      overflow-x: hidden;
      overflow-y: hidden;
      padding: var(--spacing-75) 0;
      text-overflow: ellipsis;
      text-wrap-mode: nowrap
    ">
      Football
      <span style="
        clip-path: inset(50%);
        height: 1px;
        overflow-x: hidden;
        overflow-y: hidden;
        position: absolute;
        text-wrap-mode: nowrap;
        width: 1px
      ">
        - Selected
      </span>
    </span>
  </a>
</body>
