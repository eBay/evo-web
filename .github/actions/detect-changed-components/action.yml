name: 'Detect Changed Components'
description: 'Detects which Skin components changed based on git diff'
author: 'eBay Skin Team'

inputs:
  sass-dir:
    description: 'Path to SASS directory (e.g., packages/skin/src/sass)'
    required: true
  base-branch:
    description: 'Base branch to compare against'
    required: false
    default: 'main'

outputs:
  components:
    description: 'Percy --include pattern matching the changed components'' stories ("all" for global changes, "" for no changes)'

runs:
  using: 'node24'
  main: 'index.mts'
