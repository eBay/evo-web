name: 'Percy Wait and Comment'
description: 'Waits for Percy build completion and posts PR comment with results'
author: 'eBay Skin Team'

inputs:
  percy-read-token:
    description: 'Percy read-only token for API access'
    required: true
  github-token:
    description: 'GitHub token for posting PR comments'
    required: true
  pr-number:
    description: 'Pull request number'
    required: true
  commit-sha:
    description: 'Commit SHA to find Percy build for'
    required: true
  github-repository:
    description: 'Repository in format "owner/repo"'
    required: true

outputs:
  build-status:
    description: 'Percy build status (passed, passed-with-changes, failed, error)'
  build-url:
    description: 'Percy dashboard URL for the build'
  visual-changes-count:
    description: 'Number of visual changes detected'
  build-number:
    description: 'Percy build number'
  review-state:
    description: 'Percy review state'

runs:
  using: 'node20'
  main: 'index.js'
