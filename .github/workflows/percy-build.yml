name: Percy Build

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]
    paths:
      - 'packages/skin/dist/**'
      - 'packages/skin/.storybook/**'
      - 'packages/skin/src/**'
      - '.github/workflows/percy-build.yml'
      - '.github/workflows/percy.yml'
      - 'packages/skin/.percy.yml'

concurrency:
  group: "percy-build-${{ github.head_ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build Storybook for Percy
    # Percy runs only on PRs labeled `percy`; adding the label requests a run
    if: >-
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'percy') &&
      (github.event.action != 'labeled' || github.event.label.name == 'percy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git remote add upstream https://github.com/${{ github.repository }}.git
          git fetch upstream "$BASE_REF:$BASE_REF"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Check Skin dist is up to date
        run: |
          npm run build -w packages/skin
          changes=$(git status --porcelain -- packages/skin/dist)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::packages/skin/dist is out of date. Run npm run build and commit the result."
            exit 1
          fi

      - name: Detect changed components
        id: detect
        uses: ./.github/actions/detect-changed-components
        with:
          sass-dir: 'packages/skin/src/sass'
          base-branch: ${{ github.base_ref }}

      - name: Build Storybook
        run: npm run build:storybook -w packages/skin

      - name: Save Percy metadata
        env:
          COMPONENTS: ${{ steps.detect.outputs.components }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "$COMPONENTS" > packages/skin/_site/public/storybook/.percy-components
          echo "$PR_NUMBER" > packages/skin/_site/public/storybook/.percy-pr-number
          echo "$HEAD_SHA" > packages/skin/_site/public/storybook/.percy-commit
          echo "$HEAD_REF" > packages/skin/_site/public/storybook/.percy-branch

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: packages/skin/_site/public/storybook
          retention-days: 1
          include-hidden-files: true
