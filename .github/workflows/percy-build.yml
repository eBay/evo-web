name: Percy Build
run-name: "Percy PR #${{ inputs.pr_number }} @ ${{ inputs.head_sha }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to capture'
        required: true
        type: string
      head_sha:
        description: 'Commit requested by the PR comment, if provided'
        required: false
        type: string

concurrency:
  group: "percy-build-${{ inputs.pr_number }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Storybook for Percy
    runs-on: ubuntu-latest
    cache-mode: read
    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTED_SHA: ${{ inputs.head_sha }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(number) || number < 1) {
              throw new Error('Enter a valid pull request number');
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number
            });
            const requestedSha = process.env.REQUESTED_SHA || pr.head.sha;
            if (!/^[a-f0-9]{40}$/.test(requestedSha)) {
              throw new Error('Enter a valid PR commit SHA');
            }
            core.setOutput('number', String(number));
            core.setOutput('sha', requestedSha);
            core.setOutput('current_sha', pr.head.sha);
            core.setOutput('state', pr.state);
            core.setOutput('draft', String(pr.draft));
            core.setOutput('base', pr.base.ref);

      - name: Save request metadata
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          mkdir percy-request
          echo "$PR_NUMBER" > percy-request/pr-number
          echo "$HEAD_SHA" > percy-request/commit

      - name: Upload request metadata
        uses: actions/upload-artifact@v4
        with:
          name: percy-request
          path: percy-request
          retention-days: 1

      - name: Validate pull request
        env:
          REQUESTED_SHA: ${{ steps.pr.outputs.sha }}
          CURRENT_SHA: ${{ steps.pr.outputs.current_sha }}
          PR_STATE: ${{ steps.pr.outputs.state }}
          PR_DRAFT: ${{ steps.pr.outputs.draft }}
          BASE_REF: ${{ steps.pr.outputs.base }}
        run: |
          if [ "$PR_STATE" != open ] || [ "$PR_DRAFT" != false ] || [ "$BASE_REF" != main ]; then
            echo '::error::Percy requires a ready pull request targeting main'
            exit 1
          fi
          if [ "$REQUESTED_SHA" != "$CURRENT_SHA" ]; then
            echo '::error::The PR changed after /run-percy. Comment again when ready'
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/merge
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          git fetch origin main:main

      - name: Confirm merge contains the requested commit
        env:
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          if [ "$(git rev-parse HEAD^2)" != "$HEAD_SHA" ] || [ "$(git rev-parse HEAD^1)" != "$(git rev-parse main)" ]; then
            echo '::error::The PR merge changed after /run-percy. Comment again when ready'
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Detect changed components
        id: detect
        uses: ./.github/actions/detect-changed-components
        with:
          sass-dir: 'packages/skin/src/sass'
          base-branch: 'main'

      - name: Build Storybook
        run: npm run build:storybook -w packages/skin

      - name: Save Percy metadata
        env:
          COMPONENTS: ${{ steps.detect.outputs.components }}
        run: |
          echo "$COMPONENTS" > packages/skin/_site/public/storybook/.percy-components

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: packages/skin/_site/public/storybook
          retention-days: 1
          include-hidden-files: true
