name: Percy Visual Regression

on:
  workflow_run:
    workflows: ["Percy Build"]
    types: [completed]
  push:
    branches: ["main"]
    paths:
      - 'packages/skin/dist/**'
      - 'packages/skin/.storybook/**'
      - 'packages/skin/src/sass/**/*.stories.js'
      - '.github/workflows/percy.yml'
      - 'packages/skin/.percy.yml'

permissions:
  contents: read
  statuses: write
  actions: read
  pull-requests: read

jobs:
  percy-build-failed:
    name: Report failed Percy build
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.path == '.github/workflows/percy-build.yml' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report failure to pull request
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const match = run.display_title.match(/^Percy PR #([1-9][0-9]*) @ ([a-f0-9]{40})$/);
            if (!match) {
              throw new Error('The failed build has no Percy request in its title');
            }
            if (run.conclusion === 'cancelled') {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo,
                workflow_id: 'percy-build.yml',
                event: 'workflow_dispatch',
                per_page: 50
              });
              if (data.workflow_runs.some(r => r.run_number > run.run_number && r.display_title === run.display_title)) {
                core.info('A newer Percy build for the same commit replaced this one');
                return;
              }
            }
            await github.rest.repos.createCommitStatus({
              owner, repo,
              sha: match[2],
              state: 'failure',
              context: 'Percy Visual Regression',
              description: run.conclusion === 'cancelled'
                ? 'Percy Storybook build was cancelled'
                : 'Percy Storybook build failed',
              target_url: run.html_url
            });

  percy-pr:
    name: Percy Snapshots (PR)
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.path == '.github/workflows/percy-build.yml' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm pull request still has the captured commit
        id: request
        uses: actions/github-script@v7
        with:
          script: |
            const match = context.payload.workflow_run.display_title.match(/^Percy PR #([1-9][0-9]*) @ ([a-f0-9]{40})$/);
            if (!match) {
              throw new Error('The Percy build has no Percy request in its title');
            }
            const number = Number(match[1]);
            const sha = match[2];
            core.setOutput('pr', String(number));
            core.setOutput('commit', sha);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number
            });
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' || pr.head.sha !== sha) {
              throw new Error('The pull request changed after Percy was requested. Comment /run-percy again when ready');
            }
            core.setOutput('branch', pr.head.ref);

      - name: Checkout base branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Download Storybook artifact
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read component scope
        id: meta
        run: |
          {
            echo "components<<EOF"
            tr -d '\n' < storybook-static/.percy-components
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Percy (Partial)
        if: steps.meta.outputs.components != '' && steps.meta.outputs.components != 'all'
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_COMMIT: ${{ steps.request.outputs.commit }}
          PERCY_BRANCH: ${{ steps.request.outputs.branch }}
          PERCY_PULL_REQUEST: ${{ steps.request.outputs.pr }}
          # Required: without this, Percy's own missing-snapshot check treats scoped
          # builds as incomplete full builds and fails the PR check with a
          # "missing snapshots" error, even though the scoping is intentional.
          PERCY_PARTIAL_BUILD: 1
          STORIES: ${{ steps.meta.outputs.components }}
        run: npx percy storybook ./storybook-static --include "$STORIES" -c packages/skin/.percy.yml

      - name: Run Percy (All)
        if: steps.meta.outputs.components == 'all'
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_COMMIT: ${{ steps.request.outputs.commit }}
          PERCY_BRANCH: ${{ steps.request.outputs.branch }}
          PERCY_PULL_REQUEST: ${{ steps.request.outputs.pr }}
        run: npx percy storybook ./storybook-static -c packages/skin/.percy.yml

      - name: Report Percy status to PR
        if: always() && steps.request.outputs.commit != ''
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.request.outputs.commit }}
          JOB_STATUS: ${{ job.status }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state,
              context: 'Percy Visual Regression',
              description: state === 'success' ? 'Percy snapshots passed' : 'Percy snapshots failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  percy-main:
    name: Percy Baseline (Main Branch)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Run Percy (All - Auto-approve)
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        run: npm run snapshots:all -w packages/skin
