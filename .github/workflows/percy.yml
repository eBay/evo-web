name: Percy Visual Regression

on:
  workflow_run:
    workflows: ["Percy Build"]
    types: [completed]
  push:
    branches: ["main"]
    paths:
      - 'packages/skin/dist/**'
      - 'packages/skin/.storybook/**'
      - 'packages/skin/src/sass/**/*.stories.js'
      - '.github/workflows/percy.yml'
      - 'packages/skin/.percy.yml'

permissions:
  contents: read
  statuses: write
  actions: read
  pull-requests: read

jobs:
  percy-build-failed:
    name: Report failed Percy build
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_dispatch' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Download request metadata
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: percy-request
          path: percy-request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report failure to pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const match = context.payload.workflow_run.display_title.match(/^Percy PR #([1-9][0-9]*) @ ([a-f0-9]{40})$/);
            const sha = fs.existsSync('percy-request/commit')
              ? fs.readFileSync('percy-request/commit', 'utf8').trim()
              : match?.[2];
            const number = Number(fs.existsSync('percy-request/pr-number')
              ? fs.readFileSync('percy-request/pr-number', 'utf8').trim()
              : match?.[1]);
            if (!/^[a-f0-9]{40}$/.test(sha) || !Number.isSafeInteger(number) || number < 1) {
              throw new Error('No valid Percy request metadata for the failed build');
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'failure',
              context: 'Percy Visual Regression',
              description: context.payload.workflow_run.conclusion === 'cancelled'
                ? 'Percy Storybook build was cancelled'
                : 'Percy Storybook build failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.payload.workflow_run.id}`
            });

  percy-pr:
    name: Percy Snapshots (PR)
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download request metadata
        uses: actions/download-artifact@v4
        with:
          name: percy-request
          path: percy-request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm pull request still has the captured commit
        id: request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sha = fs.readFileSync('percy-request/commit', 'utf8').trim();
            const number = Number(fs.readFileSync('percy-request/pr-number', 'utf8').trim());
            if (!/^[a-f0-9]{40}$/.test(sha) || !Number.isSafeInteger(number) || number < 1) {
              throw new Error('Invalid Percy request metadata');
            }
            core.setOutput('pr', String(number));
            core.setOutput('commit', sha);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number
            });
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' || pr.head.sha !== sha) {
              throw new Error('The pull request changed after Percy was requested. Comment /run-percy again when ready');
            }
            core.setOutput('branch', pr.head.ref);

      - name: Checkout base branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Download Storybook artifact
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read component scope
        id: meta
        run: |
          {
            echo "components<<EOF"
            tr -d '\n' < storybook-static/.percy-components
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Percy (Partial)
        if: steps.meta.outputs.components != '' && steps.meta.outputs.components != 'all'
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_COMMIT: ${{ steps.request.outputs.commit }}
          PERCY_BRANCH: ${{ steps.request.outputs.branch }}
          PERCY_PULL_REQUEST: ${{ steps.request.outputs.pr }}
          # Required: without this, Percy's own missing-snapshot check treats scoped
          # builds as incomplete full builds and fails the PR check with a
          # "missing snapshots" error, even though the scoping is intentional.
          PERCY_PARTIAL_BUILD: 1
          STORIES: ${{ steps.meta.outputs.components }}
        run: npx percy storybook ./storybook-static --include "$STORIES" -c packages/skin/.percy.yml

      - name: Run Percy (All)
        if: steps.meta.outputs.components == 'all'
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_COMMIT: ${{ steps.request.outputs.commit }}
          PERCY_BRANCH: ${{ steps.request.outputs.branch }}
          PERCY_PULL_REQUEST: ${{ steps.request.outputs.pr }}
        run: npx percy storybook ./storybook-static -c packages/skin/.percy.yml

      - name: Report Percy status to PR
        if: always() && steps.request.outputs.commit != ''
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.request.outputs.commit }}
          JOB_STATUS: ${{ job.status }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state,
              context: 'Percy Visual Regression',
              description: state === 'success' ? 'Percy snapshots passed' : 'Percy snapshots failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  percy-main:
    name: Percy Baseline (Main Branch)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Run Percy (All - Auto-approve)
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        run: npm run snapshots:all -w packages/skin
