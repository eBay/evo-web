name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: "preview-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (preview base URL)
        run: npm run deploy
        env:
          BASE_URL: /evo-web/previews/pr-${{ github.event.pull_request.number }}/

      # Artifacts reject some of the site's file names (e.g. "css?debug=1.html").
      - name: Pack site
        run: tar -czf preview-site.tgz -C _site/public .

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: preview-site.tgz
          compression-level: 0
          # Fork builds wait for approval, which GitHub allows for up to 30 days.
          retention-days: ${{ github.event.pull_request.head.repo.fork && 30 || 1 }}
